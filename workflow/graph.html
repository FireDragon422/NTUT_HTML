<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="以五份教材建立的半導體製程 LLM Wiki 與零基礎教學簡報。"><title>Workflow 流程圖</title><link rel="stylesheet" href="../slides/style.css"></head><body><header class="topbar"><a href="../index.html">半導體製程 LLM Wiki</a><nav class="toolbar"><a href="../slides/index.html">教學簡報</a></nav></header><main class="doc"><p><strong>此圖是第一版歷史流程。</strong>目前請看 <a href="controlled-graph.html">第二版 Graph 與 Loop</a>、<a href="outline-v2.html">待確認大綱</a>。</p><h1>取得資料到教學簡報</h1><p>藍色為順向流程，橘色為需要回頭檢查的路徑。</p><svg viewBox="0 0 900 1050" role="img" aria-label="由需求確認到反思的十個節點，含來源、內容與版面退回路徑"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#144db5"/></marker></defs><rect x="270" y="20" width="360" height="60" rx="6" fill="#edf0f1" stroke="#526574"/><text x="450" y="57" text-anchor="middle" font-size="22" fill="#152e40">討論並確認需求</text><path d="M450,80 V116" stroke="#144db5" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="120" width="360" height="60" rx="6" fill="#edf0f1" stroke="#526574"/><text x="450" y="157" text-anchor="middle" font-size="22" fill="#152e40">盤點五份資料</text><path d="M450,180 V216" stroke="#144db5" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="220" width="360" height="60" rx="6" fill="#dbe7fb" stroke="#526574"/><text x="450" y="257" text-anchor="middle" font-size="22" fill="#152e40">可讀性、頁碼、缺圖檢查</text><path d="M450,280 V316" stroke="#144db5" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="320" width="360" height="60" rx="6" fill="#edf0f1" stroke="#526574"/><text x="450" y="357" text-anchor="middle" font-size="22" fill="#152e40">Ingest 筆記與主張索引</text><path d="M450,380 V416" stroke="#144db5" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="420" width="360" height="60" rx="6" fill="#dbe7fb" stroke="#526574"/><text x="450" y="457" text-anchor="middle" font-size="22" fill="#152e40">內容與來源依賴檢查</text><path d="M450,480 V516" stroke="#144db5" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="520" width="360" height="60" rx="6" fill="#edf0f1" stroke="#526574"/><text x="450" y="557" text-anchor="middle" font-size="22" fill="#152e40">整合 Wiki</text><path d="M450,580 V616" stroke="#144db5" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="620" width="360" height="60" rx="6" fill="#dbe7fb" stroke="#526574"/><text x="450" y="657" text-anchor="middle" font-size="22" fill="#152e40">查詢 Wiki 與大綱檢查</text><path d="M450,680 V716" stroke="#144db5" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="720" width="360" height="60" rx="6" fill="#edf0f1" stroke="#526574"/><text x="450" y="757" text-anchor="middle" font-size="22" fill="#152e40">生成 HTML 簡報</text><path d="M450,780 V816" stroke="#144db5" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="820" width="360" height="60" rx="6" fill="#dbe7fb" stroke="#526574"/><text x="450" y="857" text-anchor="middle" font-size="22" fill="#152e40">瀏覽與引用檢查</text><path d="M450,880 V916" stroke="#144db5" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="920" width="360" height="60" rx="6" fill="#edf0f1" stroke="#526574"/><text x="450" y="957" text-anchor="middle" font-size="22" fill="#152e40">執行報告與反思</text><g fill="none" stroke="#b94724" stroke-width="2"><path d="M270,250 H110 V150 H265" marker-end="url(#arrow)"/><path d="M630,450 H790 V250 H635" marker-end="url(#arrow)"/><path d="M270,650 H80 V350 H265" marker-end="url(#arrow)"/><path d="M630,850 H820 V550 H635" marker-end="url(#arrow)"/><path d="M270,850 H180 V750 H265" marker-end="url(#arrow)"/></g><g font-size="18" fill="#b94724"><text x="15" y="205">改讀影像、核頁碼</text><text x="650" y="330">矛盾：回原頁</text><text x="10" y="480">知識缺口：補 ingest</text><text x="645" y="690">內容錯誤：修 Wiki</text><text x="10" y="810">版面或操作：重生</text></g></svg><p class="graph-caption">可讀性不通過時先修讀取方式；知識問題回來源或 Wiki；呈現問題回 HTML。
