<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1110" role="img" aria-labelledby="title desc">
<title id="title">Wiki 到簡報的受控流程</title><desc id="desc">查詢、覆蓋檢查、來源卡、大綱與人工確認、逐頁稿、獨立審查、排版、呈現檢查與交付。內容問題退回逐頁稿，版面問題退回排版，局部最多兩次修訂。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#144db5"/></marker></defs>
