<g font-family="Microsoft JhengHei,sans-serif" font-size="24" fill="#152e40" text-anchor="middle"><text x="500" y="81">查詢 Wiki</text><text x="500" y="181">覆蓋檢查：不足就停止</text><text x="500" y="281">分來源證據卡</text><text x="500" y="381">大綱與配圖安排</text><text x="500" y="481">使用者確認此版大綱</text><text x="500" y="581">逐頁稿與圖說凍結</text><text x="500" y="681">獨立忠實度審查</text><text x="500" y="781">HTML 排版：不改內容</text><text x="500" y="881">呈現與文字一致性檢查</text><text x="500" y="981">交付報告與反思</text><text x="500" y="1080" font-size="20">局部修訂最多兩次；上游變更使下游確認失效</text></g>
